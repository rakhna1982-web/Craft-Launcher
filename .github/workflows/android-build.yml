name: Build CraftLauncher Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 3. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Set up Gradle 9.3.1 & dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 5. Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: 6. Build CraftLauncher Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: 7. Upload APK as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CraftLauncher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
